name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Preparar Gradle Wrapper
        run: |
          flutter create --platforms=android --project-name wrapper_template "$RUNNER_TEMP/wrapper_template"
          mkdir -p android/gradle/wrapper
          cp "$RUNNER_TEMP/wrapper_template/android/gradlew" android/gradlew
          cp "$RUNNER_TEMP/wrapper_template/android/gradlew.bat" android/gradlew.bat
          cp "$RUNNER_TEMP/wrapper_template/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
          cp "$RUNNER_TEMP/wrapper_template/android/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/
          chmod +x android/gradlew
      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD"
          echo "$KEYSTORE_B64" | base64 -d > android/release-keystore.p12
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=livro\nstoreFile=release-keystore.p12\nstoreType=pkcs12\n' \
            "$STORE_PASSWORD" "$STORE_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ceu-e-o-inferno-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: app/ceu-e-o-inferno-${{ github.ref_name }}.apk
      - uses: actions/attest-build-provenance@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: app/ceu-e-o-inferno-${{ github.ref_name }}.apk
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "ceu-e-o-inferno-${{ github.ref_name }}.apk" --title "${{ github.ref_name }}" --generate-notes
      - name: Manter apenas o APK atual em apk/
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p apk
          cp app/ceu-e-o-inferno-${{ github.ref_name }}.apk apk/ceu-e-o-inferno.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          git diff --cached --quiet || git commit -m "APK ${{ github.ref_name }}"
          git push origin main
